# Local development database. Start with: docker compose up -d db
# Matches DATABASE_URL in .env (postgresql://cstu:cstu@localhost:5432/cstu_dev).
#
# This file is for LOCAL DEV ONLY. The cstu:cstu credentials are weak and ports
# are bound to 127.0.0.1 so the DB is never reachable from other hosts (D1/D2).
# For any shared/production deploy use a managed database (Cloud SQL / RDS) or a
# private network with strong, unique credentials — do NOT reuse this compose.
services:
  db:
    image: postgres:17-alpine
    container_name: cstu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cstu
      POSTGRES_PASSWORD: cstu
      POSTGRES_DB: cstu_dev
    ports:
      # Loopback-only: reachable from this machine, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - cstu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cstu -d cstu_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher. Start with: docker compose up -d mailpit
  # App sends to smtp://localhost:1025 (set SMTP_URL in .env); read captured
  # mail — rendered HTML, headers, recipients — at http://localhost:8025.
  # Nothing leaves your machine, so no real Gmail credentials are needed in dev.
  mailpit:
    image: axllent/mailpit:latest
    container_name: cstu-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI

volumes:
  cstu_pgdata:
