# Dependency & supply-chain updates (Dep3). Dependabot opens PRs for vulnerable
# or outdated packages; review Auth.js (still beta) and Next/Stripe bumps
# against their changelogs before merging.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk patch/minor bumps into one PR to cut review noise.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
