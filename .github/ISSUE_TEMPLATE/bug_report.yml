name: 🐞 Bug
description: Unexpected thing to be fixed
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Problem
      description: What happened?
      placeholder: App crashed / Shown error info / ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps
      description: How to reproduce it.
      placeholder: |
        1. Open /
        2. Click...
        3. Show...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should it be?
    validations:
      required: true

  - type: textarea
    id: more-info
    attributes:
      label: More Info
      description: Anything else? Logs? Screenshots?
    validations:
      required: false
